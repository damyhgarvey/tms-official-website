<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="TMS Identity — connexion sécurisée"><title>TMS — Connexion</title><link rel="icon" href="assets/brand/tms-logo.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><img class="brand-logo" src="assets/brand/tms-logo.svg" alt="TMS"><small>IDENTITY • ACCESS</small></a><a class="nav-cta" href="index.html">← Site public</a></header><main class="section request-page"><div class="section-head"><p class="eyebrow">TMS IDENTITY • SECURE ACCESS</p><h1>Connexion<br><em>TMS.</em></h1><p class="lead">Votre identité détermine vos droits. Le serveur TMS reste l'autorité d'authentification et d'autorisation.</p></div><div class="form-card" style="max-width:680px"><label>Email<input id="email" type="email" autocomplete="username" required placeholder="votre@email"></label><label>Mot de passe<input id="password" type="password" autocomplete="current-password" required></label><div class="actions"><button id="login" class="btn primary" type="button">Se connecter →</button></div><p id="status"></p></div></main><script>const email=document.querySelector('#email'),password=document.querySelector('#password'),status=document.querySelector('#status');async function go(){status.textContent='Authentification…';try{const r=await fetch('https://damyhgarvey.tail4ccb28.ts.net/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Connexion refusée');sessionStorage.setItem('tms_identity_token',d.token);sessionStorage.setItem('tms_identity_user',JSON.stringify(d.user));status.textContent=`Connecté : ${d.user.role}`;setTimeout(()=>location.href=d.user.role==='ADMIN'||d.user.role==='ERP_MANAGER'?'admin.html':'index.html',250); }catch(e){status.textContent=e.message;}}document.querySelector('#login').addEventListener('click',go);password.addEventListener('keydown',e=>{if(e.key==='Enter')go()});</script><script src="js/theme.js"></script></body></html>
